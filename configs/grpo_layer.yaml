# Layer growth via GRPO: append one more transformer block on top of an already-expanded stack --
# the same growth mechanics as sft_layer.yaml (splice in a block, keep every grown block trainable,
# freeze only the original base) -- but instead of supervised fine-tuning on (prompt, answer)
# pairs, this round reinforcement-learns the new block, and every earlier trainable one, against a
# reward signal, using the same GRPOTrainer tiny_lora.train_grpo already drives for plain TinyLoRA
# runs. See layer_grow/train_grpo.py's docstring for how the two share that trainer loop.
#
# Starting point is outputs/sft-layer-grow/checkpoint-3750: sft_layer.yaml's own run, currently a
# 26-layer, 3-round stack -- NOT the 26-layer/2-round shape sft_layer.yaml's own header comment
# describes (base 24 + layer 24 from sft_layer_expand.yaml + layer 25 from sft_layer.yaml). A
# third round was grown at some point between checkpoint-2000 and this one -- checkpoint-3750's own
# layer_grow.json records rounds [24] (layer_expand) then [25], [25] again (both layer_grow, both
# 3072d/16640/48 heads), which is base_num_hidden_layers(24) + 3 grown blocks = 26 total layers
# (config.json's own num_hidden_layers confirms 26), with what was trained as "layer 25" after
# round 2 now sitting at index 26 after round 3 spliced a fresh block in ahead of it at index 25.
# Worth checking sft_layer.yaml's own run history if that wasn't intentional -- growing from here
# either way, since it's what previous_checkpoint actually resolves to.
#
# Named explicitly, like sft_layer.yaml names checkpoint-16000, rather than pointed at the bare run
# directory -- sft_layer.yaml's training.save_total_limit: 5 rotates older checkpoints out as new
# ones are saved, so "whatever the run has reached" would silently change which weights this round
# grows from as sft_layer.yaml keeps training in the background; pin a specific checkpoint-N here
# and bump it by hand (or via --previous-checkpoint) when a later one is worth growing from
# instead. As of this writing checkpoint-3750 is not the newest (sft_layer.yaml targets
# max_steps: 20000 and is still running), so growing now means growing on top of an *unfinished*
# SFT round -- every earlier block keeps training underneath this round's own trainable tail either
# way (freeze_all_growth leaves it open, see layer_grow/model.py), so that is a choice to make
# deliberately, not a bug to fix.
#
# This round appends layer 26, inheriting the newest block's own shape (see the hardcoded shape
# fields below, confirmed directly from checkpoint-3750's own weights) rather than widening
# further -- there's no evidence yet that this stack needs to get wider before it's worth teaching
# it to reason better with what it already has.
#
# layer_grow.reward_set picks which reward functions from layer_grow/rewards.py score completions:
#   "math"      (default) GSM8K-shaped arithmetic word problems -- `#### <number>`,
#               `<<a op b = c>>` steps. Matches correctness_reward/reasoning_step_reward/
#               calculation_accuracy_reward in tiny_lora/rewards.py.
#   "diagnosis" data/synthetic/data_science_word_problems.py's overfitting/underfitting cases --
#               `#### overfitting` / `#### underfitting`. Matches diagnosis_reward.
# The two sets are not interchangeable against the wrong data: format_reward and
# calculation_accuracy_reward always score 0 against a diagnosis label, and diagnosis_reward always
# scores 0 against a numeric one -- see layer_grow/rewards.py for why they're kept separate rather
# than merged into one list.
#
# Build the dataset first. data: below now points at the v2 set (see that block's own comment):
#     OUT_DIR=/Volumes/PS2000W/ds-assistant-grpo-v2 FORMATS=grpo bash data_generate_v2.sh
# which writes grpo_train-*.jsonl / grpo_eval.jsonl straight into OUT_DIR via build_v2.py --
# whole end-to-end / alternative-model / metric-diagnosis code tasks plus the identity and
# knowledge-base catalogues, NOT math_word_problems.py's/data_science_word_problems.py's
# `#### <number>` / `#### overfitting` shape. See the REWARD MISMATCH note in data: below before
# training against it -- reward_set: "math" (still the default here) scores 0 on every example of
# this set as of this writing.
#
# Then, once the zip below is rebuilt and re-uploaded (data: block):
#     poetry run layer_grow grpo --config configs/grpo_layer.yaml --no-quant
#
# or, since this is the default config, just:
#     poetry run layer_grow grpo --no-quant
#
# Grow a different shape/position, or switch reward sets and dataset, per-run without editing this
# file:
#     poetry run layer_grow grpo --layers 28 --reward-set diagnosis \
#         --previous-checkpoint outputs/grpo-layer-grow-run2

model:
  model_name_or_path: "Qwen/Qwen2.5-0.5B-Instruct"  # base model pulled from the Hugging Face Hub
  load_in_4bit: false          # full bf16; `--no-quant` forces this off regardless
  torch_dtype: "auto"          # let transformers pick the dtype the checkpoint was saved in
  trust_remote_code: false     # Qwen2.5 ships standard modeling code; no custom code needed
  attn_implementation: null    # let transformers pick (e.g. sdpa); set "flash_attention_2" where supported

layer_grow:
  # sft_layer.yaml's own run, pinned to a specific checkpoint -- see the header comment above for
  # why this isn't left pointed at the bare run directory.
  previous_checkpoint: "outputs/sft-layer-grow/checkpoint-250"

  # Google Drive fallback for previous_checkpoint, same reasoning as sft_layer.yaml's. Nothing
  # uploaded yet as of this writing -- outputs/sft-layer-grow is still mid-run locally -- so this
  # is a placeholder to fill in once checkpoint-3750 (or whichever checkpoint previous_checkpoint
  # is bumped to) is worth sharing across machines. cache_dir matches previous_checkpoint exactly,
  # same reasoning as sft_layer.yaml's own cache_dir note, so a zip of just that checkpoint's
  # contents lands directly where a local run would have written it.
  gdrive:
    zip_file_id: 11J-UO7J1BgMgN49H5ri5z-zxU1uwSMHG
    cache_dir: "outputs/sft-layer-grow/checkpoint-250"

  # Position(s) this round touches, 0-based, checked against previous_checkpoint's own layer
  # count -- 26 layers (0-23 base, 24/25 grown -- see the header comment above for why that's 3
  # blocks, not 2). An index at or beyond that count appends a new block there, as [26] does
  # here. An index below it (e.g. [20], a base layer, or [25], an already-grown one) names an
  # *existing* layer instead: no new block is spliced in, that layer is just unfrozen and
  # fine-tuned further from previous_checkpoint's own weights for it -- both kinds can appear in
  # the same list. See layer_grow/model.py's split_layers for the exact rule.
  layers: [28]

  # Hardcoded to layer 26's own shape rather than left null -- confirmed directly from
  # checkpoint-3750/model.safetensors's tensor shapes, not just the layer_grow.json sidecar:
  # model.layers.26.in_proj.weight is [3072, 896] (hidden_size 3072, base_hidden_size 896),
  # inner.mlp.down_proj.weight is [3072, 16640] (intermediate_size 16640), inner.self_attn.
  # q_proj.weight is [3072, 3072] and k_proj.weight is [128, 3072] -- 3072/64 = 48 attention heads
  # and 128/64 = 2 key/value heads at this stack's fixed head_dim of 64 (cross-checked against the
  # base model's own unwrapped layer 23: q_proj is [896, 896], 896/64 = 14, matching Qwen2.5-0.5B's
  # published num_attention_heads). Same values null would have inherited via
  # layer_grow.model.resolve_growth_shape -- spelled out explicitly so this round's shape doesn't
  # silently change if a future previous_checkpoint's newest block ever has a different one.
  hidden_size: 3072
  intermediate_size: 16640
  num_attention_heads: 48
  num_key_value_heads: 2

  # "identity" zeroes this round's block's output projections, so it starts as a residual
  # passthrough and GRPO moves it away from exactly what previous_checkpoint already does, rather
  # than injecting noise -- and rather than a sampled-completion reward gradient's first few
  # updates landing on a block that starts at random weights. Same reasoning as sft_layer.yaml.
  init: "identity"
  init_std: 0.02

  # "auto" continues *this round* from <training.output_dir>/model if a previous attempt at it
  # already finished, otherwise builds a fresh block for layer 26.
  init_from_checkpoint: "auto"

  # See the header comment above for what this picks and why "math" vs "diagnosis" aren't mixed.
  # The set also picks the system prompt (layer_grow/rewards.py's SYSTEM_PROMPTS): "math" spells
  # out the `a op b = c` steps + `#### <number>` format its rewards score, with a worked example --
  # the first run without it scored 0 on format/reasoning_step/calculation_accuracy for 270 steps.
  # Set data.system_prompt to override it (null turns it off).
  reward_set: "math"

data:
  # reader: "gdrive" -- this config runs on a training machine (Colab) that has no access to the
  # Mac's /Volumes/PS2000W, so ensure_gdrive_dataset fetches the dataset zip into gdrive.cache_dir
  # and extracts it there first, then dataset_name is read exactly like a local path pointed at
  # the same glob. cache_dir here is just a plain path on the training machine -- nothing macOS-
  # or /Volumes-specific about it there.
  #
  # gdrive.mount_path (preferred) vs gdrive.zip_file_id: `ensure_gdrive_dataset`
  # (tiny_lora/data.py) tries mount_path first when set. zip_file_id goes through gdown's
  # anonymous public-link download, which turned out to be unreliable for a file this size --
  # "Too many users have viewed or downloaded this file recently" on two different, essentially
  # unviewed files in a row (see tiny_lora/gdrive.py's module docstring); that's Google's abuse
  # heuristic reacting to the request pattern (scripted, cookie-less, >100MB), not real
  # popularity. mount_path instead has Colab mount the account's own Drive
  # (google.colab.drive.mount) and reads the file authenticated as its owner, same as a browser
  # download, which sidesteps that heuristic entirely.
  #
  # That fetch only happens once: ensure_gdrive_dataset skips it on every later run once cache_dir
  # is non-empty ("already populated" is checked by "has any files in it," not "has
  # grpo_train-*.jsonl specifically"), so a second `layer_grow grpo` on the same training machine
  # reads the already-extracted shards straight off disk.
  #
  # dataset_name/gdrive.cache_dir point at the v2 set built into
  # /Volumes/PS2000W/ds-assistant-grpo-v2 on the Mac (`grpo_train-*.jsonl` / `grpo_eval.jsonl`,
  # same names as before, so no glob change needed here) via data_generate_v2.sh's build_v2.py:
  #     OUT_DIR=/Volumes/PS2000W/ds-assistant-grpo-v2 FORMATS=grpo bash data_generate_v2.sh
  # -- identity + knowledge-base pairs, plus whole end-to-end / alternative-model /
  # metric-diagnosis code tasks (data/synthetic/code_tasks_v2.py), all as free-text
  # {"prompt": [...], "answer": "<prose>"} pairs.
  #
  # *** REWARD MISMATCH, not yet fixed *** -- this is NOT math_word_problems.py's/
  # data_science_word_problems.py's `<<a op b = c>>` + `#### <number>` / `#### overfitting` shape.
  # None of this set's `answer` values contain a `####` marker at all, so
  # extract_gsm8k_answer/extract_label_answer (src/tiny_lora/rewards.py) fail to parse it on every
  # single example, and correctness_reward/diagnosis_reward return a hard 0 across the whole set
  # regardless of reward_set below -- there is currently no reward_set that scores this data. Do
  # not run `layer_grow grpo` against this dataset_name until a reward_set for free-text
  # end-to-end/alt-model/diagnosis answers exists (see layer_grow/rewards.py).
  #
  # gdrive.mount_path assumes ds-assistant-grpo-v2.zip was uploaded to the root of "My Drive" --
  # adjust to e.g. "some/folder/ds-assistant-grpo-v2.zip" if it landed somewhere else.
  # gdrive.zip_file_id is kept as a fallback for a non-Colab training machine: it's the new v2
  # zip's id (not the old pre-v2 one), but as of this writing it's still hitting the same
  # anonymous-download throttle mount_path exists to route around -- may clear on its own
  # (Google's own estimate is up to 24h from the first hit) or may need cookie-based auth for
  # gdown (see tiny_lora/gdrive.py's docstring) if it doesn't.
  #
  # dataset_name must live under gdrive.cache_dir below, not the Mac's own
  # /Volumes/PS2000W/ds-assistant-grpo-v2 -- load_raw_dataset globs dataset_name literally (see
  # tiny_lora/data.py), it never resolves it relative to cache_dir; this "gdrive" block is only
  # ever read on a machine that just extracted the zip into cache_dir.
  #
  # No eval_dataset_name here, unlike sft_layer.yaml's data: block -- tiny_lora.train_grpo has no
  # eval loop at all currently (prepare_grpo_dataset builds only a train split; run_grpo_core never
  # passes GRPOTrainer an eval_dataset), so setting one would just be silently unused. The v2 set
  # does write its own grpo_eval.jsonl into the same cache_dir, but nothing here reads it.
  reader: "gdrive"
  dataset_name: "data/synthetic/dataset/grpo_train-*.jsonl"
  max_samples: 20000
  gdrive:
    mount_path: "ds-assistant-grpo-v2.zip"                    # tried first -- Colab Drive mount, sidesteps gdown's throttling
    zip_file_id: 1KdEk7Z8uVcKaAVZezDwDvde5wXqhmFNe             # fallback for non-Colab machines -- currently also throttled, see note above
    cache_dir: "data/synthetic/dataset"

training:
  # A fresh directory, not outputs/sft-layer-grow: this run's checkpoints are a 28-layer stack, one
  # more block than that run's 27 -- writing into the same dir would collide with
  # check_growth_matches on the first save (its sidecar already describes a 3-round/27-layer
  # stack), and with save_total_limit's rotation, which sorts checkpoint-N by step number and
  # would have to make sense of previous_checkpoint's own checkpoint-3750 sitting well past this
  # run's max_steps. Training happens on an ephemeral box (Colab), so there is no "external
  # volume" to point this at the way sft_layer.yaml's own comment does -- outputs/grpo-layer-grow,
  # inside the repo's own outputs/, is enough to just not be outputs/sft-layer-grow.
  #
  # "-run2", not outputs/grpo-layer-grow: that dir holds the first run's checkpoints (stopped at
  # ~step 270, see reward_set's note), and with no finished <output_dir>/model to continue from,
  # run_grpo_core resumes the newest checkpoint-N it finds there -- weights, optimizer and step
  # count from a run with a different batch shape and no system prompt.
  output_dir: "outputs/grpo-layer-grow"
  num_train_epochs: 1          # max_steps overrides this
  max_steps: 2000
  # In trl==0.14.0 this counts *prompts*, each expanded into num_generations completions -- 1 x 4
  # keeps each micro-batch at 4 completions, as 2 x 2 did, and 8 prompts / 32 completions per step.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  # Cautious, same reasoning sft_layer.yaml gives its own learning_rate versus
  # sft_layer_expand.yaml's: every earlier block already has real, trained weights by the time this
  # round starts, so a peak LR sized for nudging a fresh block off zero would overshoot them. GRPO's
  # own default (grpo_default.yaml) is already this low for a different reason -- noisy,
  # sampled-completion gradients -- so it's left unchanged here rather than lowered further.
  learning_rate: 1.0e-5
  # Was 0 (HF's default), which put the very first step at the full peak LR: at ~step 10 `kl` was
  # already 3.8 against a reference that was identical to the policy at step 1. 50 is 2.5% of
  # max_steps. Only takes effect on a fresh run -- resuming a checkpoint-N restores its scheduler.
  warmup_steps: 50
  # KL penalty weight (trl==0.14.0 default 0.04), raised because that run's `kl` of 3.8 came from
  # a reward signal that was almost all noise (mean reward 0.017). In this trl version the logged
  # `loss` is exactly beta * `kl`, so expect `loss` to scale with this too.
  beta: 0.1
  # trl truncates prompts from the *left*, so an over-long one silently loses its system prompt
  # first. Measured with the real tokenizer: math prompts plus the "math" system prompt reach 284
  # tokens (v1 and v2 generators alike), past the 256 this used to be.
  max_prompt_length: 384
  # Was 128: completions averaged ~120 tokens, nearly all cut off before the closing '####' line.
  max_completion_length: 256
  # Completions sampled per prompt; GRPO's advantage is each one's reward relative to the group.
  # Was 2: with two, any difference at all normalizes to +/-0.707, so a 49- vs 50-word length
  # penalty pushed as hard as right vs wrong, and a reward neither sample earns adds no gradient.
  num_generations: 4
  logging_steps: 10
  # Completions printed per logging_steps (0 = off) -- see tiny_lora/rewards.py's
  # make_sample_printer. Logged as rewards/print_samples, always 0; it never touches the reward.
  print_samples: 2
  save_steps: 50
  save_total_limit: 5          # keep only the most recent few
  bf16: true
  # Off, same reasoning as sft_layer.yaml: every layer before the trainable tail is frozen and
  # stores no activations to recompute -- checkpointing here would pay a recompute cost for memory
  # that was never allocated. Lower per_device_train_batch_size instead if this OOMs.
  gradient_checkpointing: false
  report_to: "none"
