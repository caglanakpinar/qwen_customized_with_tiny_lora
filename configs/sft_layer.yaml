# Layer growth: append one more transformer block on top of an already-expanded stack, and
# fine-tune it *together with* the block(s) already there -- unlike layer_expand, which freezes
# everything except the block it just added, this keeps the whole trainable tail open.
#
# Starting point is outputs/sft-layer-expand-wide/checkpoint-16000: a 25-layer model (base 24 +
# one wide block at layer 24, from configs/sft_layer_expand.yaml). It is the newest -- and, as of
# this writing, the ONLY -- checkpoint left under that run's output_dir; earlier checkpoints
# (including checkpoint-11200, benchmarked in README.md's run 7) were rotated out by
# training.save_total_limit. Note the caveat that comes with it: README.md's "Benchmark Results"
# section reads checkpoint-16000 as showing overfitting relative to checkpoint-11200 (flat
# eval_loss/perplexity despite 4800 more steps, and falling rouge_l_f1/token_f1) -- growing a much
# larger block on top of it (see the width note below) compounds whatever that run already
# overfit, rather than starting from a clean base. Worth a fresh, non-rotated checkpoint-11200-like
# save next time before growing again, if this run is repeated.
#
# This round appends layer 25 at 2x layer 24's width (3072 vs 1536), NOT the same width -- see the
# shape block below for why that is not simply "2x the parameters." Both 24 and 25 stay trainable;
# only the original base (0-23, already carrying the merged TinyLoRA + layer_lora weights) stays
# frozen.
#
# There is no base_adapters here, unlike layer_expand: whatever adapters the first round merged
# are already baked into checkpoint-16000's weights, so there is nothing left to merge again.
#
# Loading this checkpoint later needs the layer_grow package, the same way a layer_expand
# checkpoint needs layer_expand: `tiny-lora chat|serve|chat-api|eval --adapter <dir>` detect the
# layer_grow.json sidecar and handle it automatically, as do chat.sh/web.sh/eval.sh via ADAPTER.
#
# Build the dataset first (or leave data.reader: "gdrive" below):
#     bash data_generate.sh
#
# Then:
#     poetry run layer_grow sft --config configs/sft_layer.yaml --no-quant
#
# or, since this is the default config, just:
#     poetry run layer_grow sft --no-quant
#
# Grow further shapes/positions per-run without editing this file:
#     poetry run layer_grow sft --layers 25 --hidden-size 3072 --num-attention-heads 48 \
#         --intermediate-size 16640 --no-quant

model:
  model_name_or_path: "Qwen/Qwen2.5-0.5B-Instruct"  # base model pulled from the Hugging Face Hub
  load_in_4bit: false          # full bf16; `--no-quant` forces this off regardless
  torch_dtype: "auto"          # let transformers pick the dtype the checkpoint was saved in
  trust_remote_code: false     # Qwen2.5 ships standard modeling code; no custom code needed
  attn_implementation: null    # let transformers pick (e.g. sdpa); set "flash_attention_2" where supported

layer_grow:
  # The finished layer_expand (or layer_grow) checkpoint this round grows from. A directory
  # holding layer_expand.json/layer_grow.json directly, or the run directory containing one, in
  # which case the latest weights are taken. Everything checkpoint-16000 already learned --
  # the merged TinyLoRA + layer_lora base, and the trained layer-24 block -- carries forward;
  # there is nothing to re-merge, unlike layer_expand's base_adapters.
  previous_checkpoint: "outputs/sft-layer-expand-wide/checkpoint-16000"

  # Google Drive fallback for previous_checkpoint, used only when nothing usable is found at that
  # path locally -- e.g. a fresh machine that has not trained or downloaded
  # outputs/sft-layer-expand-wide itself yet. Mirrors data.gdrive/training.gdrive above and in
  # sft_layer_expand.yaml. Set zip_file_id to a zip of checkpoint-16000's contents (or of the
  # whole outputs/sft-layer-expand-wide run) uploaded to Drive; leave it null to require the local
  # path to already exist.
  gdrive:
    zip_file_id: 1Wj5a1Ib5_QrxHe6OsUCsPaj3tZ5qp0fO            # set to the Drive file id of a zipped checkpoint-16000
    # Same as previous_checkpoint above -- spelled out explicitly (matching training.gdrive.cache_dir's
    # style in sft_layer_expand.yaml) rather than left null-to-default, so a zip of just
    # checkpoint-16000's contents lands directly where a local run would have written it.
    cache_dir: "outputs/sft-layer-expand-wide/checkpoint-2000"

  # Position(s) this round's new block(s) take in the *final* stack, 0-based. checkpoint-16000 is
  # already 25 layers (0-23 base, 24 the first grown block), so [25] appends one more, giving 26.
  layers: [25]

  # Shape of this round's new block: 2x layer 24's width (1536 -> 3072), NOT null-inherit-previous
  # (see layer_grow.model.resolve_growth_shape -- leaving all four null here would have kept layer
  # 25 at layer 24's own 1536d/8320-MLP/24-head shape instead of widening it).
  #
  # 3072 = 48 heads x head_dim 64, same constraint layer_expand's own shape carries: hidden_size
  # must equal num_attention_heads * 64, and head_dim itself cannot change (shared rotary tables
  # and KV cache across the stack) -- so widen via num_attention_heads only.
  #
  # 16640 = 8320 * 2, keeping the same intermediate/hidden ratio (5.42, matching Qwen2.5-0.5B's
  # own 4864/896 MLP ratio) that sft_layer_expand.yaml used for layer 24, rather than letting the
  # ratio drift.
  #
  # IMPORTANT: doubling hidden_size does not double this block's parameter count -- the MLP term
  # (3 * hidden_size * intermediate_size) scales with BOTH dimensions doubling, so it scales ~4x.
  # This block: 178.5M params (vs layer 24's 46.2M, a 3.86x jump), and because layer_grow keeps
  # every earlier block trainable too (see freeze_all_growth below), this run trains layer 24 AND
  # 25 together: ~224.7M trainable params, ~45% of the ~494M-parameter model, against the same
  # ~50k-row dataset that already showed overfitting signs on a 46.2M-param block alone (see
  # README.md's checkpoint-16000 interpretation). Worth watching eval_loss closely from step 1.
  hidden_size: 3072
  intermediate_size: 16640
  num_attention_heads: 48
  num_key_value_heads: null

  # "identity" zeroes this round's block's output projections, so it starts as a residual
  # passthrough and training moves away from exactly what checkpoint-16000 already was, rather
  # than injecting noise into a working stack from step one. Same reasoning as layer_expand.init.
  init: "identity"
  init_std: 0.02               # std of the normal init applied before the output zeroing

  # "auto" continues *this round* from <training.output_dir>/model if a previous attempt at it
  # already finished, otherwise builds a fresh block for layer 25. A run interrupted partway is
  # restored by the Trainer itself (optimizer state, LR schedule, step count included), which is
  # why this deliberately ignores checkpoint-N in output_dir -- see layer_grow.model's docstring.
  init_from_checkpoint: "auto"

data:
  # "local" reads dataset_name/eval_dataset_name straight off disk. "gdrive" first downloads
  # a zip from Google Drive into gdrive.cache_dir and extracts it there, then reads the same
  # paths -- so once downloaded, both readers behave identically.
  reader: "gdrive"
  dataset_name: "data/synthetic/dataset/sft_train-*.jsonl"   # training shards
  eval_dataset_name: "data/synthetic/dataset/sft_eval.jsonl" # held-out split, enables eval loss
  max_samples: 50000            # cap on training rows read from the glob
  max_eval_samples: 500         # eval runs every eval_steps and scores this whole split each time
  gdrive:
    zip_file_id: 1sHfgWM_1IlPwds06oOtlatbE9QU-QOoT
    cache_dir: "data/synthetic/dataset"

training:
  # A fresh directory, not outputs/sft-layer-expand-wide: this run's checkpoints are a different
  # architecture (26 layers, two trainable blocks) from that run's (25 layers, one). Writing into
  # the same dir would collide with check_growth_matches/check_sidecar_matches on the first save.
  output_dir: "outputs/sft-layer-grow"
  # No training.gdrive block here (yet): unlike layer_expand.base_adapters, which points at
  # finished runs that already exist somewhere, this output_dir starts empty -- there is no
  # zipped checkpoint-N for *this* run to fall back to on a fresh machine until one has actually
  # been trained and uploaded. Add one here once you have a run worth resuming from elsewhere.
  num_train_epochs: 1          # max_steps overrides this
  max_steps: 20000
  # UNMEASURED, and the old estimate below no longer applies now that layer 25 is 3072-wide, not
  # 1536: its own activations roughly double again (intermediate_size 16640 vs layer 24's 8320),
  # and its optimizer state (AdamW moments over 178.5M params, ~3.86x layer 24's 46.2M) adds
  # meaningfully more static memory than the old two-equal-blocks estimate assumed. The vocab
  # projection (151,936 x ~10 bytes/token) still dominates per-token activation memory, so this
  # is not a clean 2x/4x either -- measure before committing to a batch size; drop
  # per_device_train_batch_size and raise gradient_accumulation_steps to match if it OOMs.
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4   # effective batch size = train_batch_size * this
  # Two trainable blocks, one of them (layer 24) already past its own identity-init phase, so a
  # slightly lower LR than layer_expand's first round -- layer 24 is now a working part of the
  # model, not a passthrough being nudged off zero, and a peak LR sized for that first move would
  # overshoot on a block that already has real weights to disturb only carefully.
  learning_rate: 5.0e-5
  lr_scheduler_type: "cosine"
  warmup_steps: 200            # shorter than layer_expand's: only layer 25 starts at identity now
  max_grad_norm: 1.0
  # Both trainable blocks have real, non-zero weights by the time this round starts (layer 24
  # from its own training, layer 25 from N(0, init_std) like layer_expand's blocks always do) --
  # same reasoning as sft_layer_expand.yaml's weight_decay, carried forward.
  weight_decay: 0.02
  adam_beta2: 0.999
  neftune_noise_alpha: 5
  label_smoothing_factor: 0.0
  max_seq_length: 1536
  logging_steps: 10
  eval_steps: 50               # how often (in steps) eval loss is computed
  save_steps: 250              # must stay a round multiple of eval_steps when early_stopping is on
  save_total_limit: 5          # keep only the most recent few; the best one is exempt
  bf16: true
  # Off on purpose, same reasoning as layer_expand: every layer before the trainable tail is
  # frozen and stores no activations to recompute. Lower per_device_train_batch_size instead.
  gradient_checkpointing: false
  report_to: "none"
  # Two trainable blocks (~224.7M params combined: layer 24's 46.2M + layer 25's 178.5M at 3072d)
  # against the same ~50k-sample dataset makes the overfitting risk layer_expand already flagged
  # far more binding, not less -- ~45% of the model is now trainable, up from 9.4% for layer 24
  # alone, and checkpoint-16000 (this run's own starting point) already showed overfitting
  # signs at 46.2M trainable params (see README.md). Watch eval_loss from the first eval_steps.
  early_stopping: true
  early_stopping_patience: 5
  # See sft_layer_expand.yaml's note: 0.0 counts any decrease, however small, as improvement and
  # can let a plateaued run grind on for thousands of extra steps. This carries the same fix.
  early_stopping_threshold: 0.002
