# Layer growth: append one more transformer block on top of an already-expanded stack, and
# fine-tune it *together with* the block(s) already there -- unlike layer_expand, which freezes
# everything except the block it just added, this keeps the whole trainable tail open.
#
# Starting point is outputs/sft-layer-grow/checkpoint-1500: an already-grown 28-layer model
# (layers 0-27; 0-23 are the original base). Its layer_grow.json records four rounds: layer 24
# (1536d, from layer_expand), then layer 25 three times over at 3072d/16640/48 heads (layer_grow
# kept appending at index 25, which is why the stack has 25, 26 and 27 at that shape).
#
# This round appends layer 28, widened to 6144d/33280 MLP/96 heads (see layer_grow below), making a
# 30-layer model. Every block earlier rounds grew (24-27) plus the new layer 28 stays trainable;
# only the original base (0-23, already carrying the merged TinyLoRA + layer_lora weights) stays
# frozen.
#
# There is no base_adapters here, unlike layer_expand: whatever adapters the first round merged
# are already baked into checkpoint-1500's weights (its full state dict is loaded, base layers
# included), and its sidecar carries the base_adapters list forward as a record only.
#
# Loading this checkpoint later needs the layer_grow package, the same way a layer_expand
# checkpoint needs layer_expand: `tiny-lora chat|serve|chat-api|eval --adapter <dir>` detect the
# layer_grow.json sidecar and handle it automatically, as do chat.sh/web.sh/eval.sh via ADAPTER.
#
# Build the dataset first (or leave data.reader: "gdrive" below):
#     bash data_generate.sh
#
# Then:
#     poetry run layer_grow sft --config configs/sft_layer.yaml --no-quant
#
# or, since this is the default config, just:
#     poetry run layer_grow sft --no-quant
#
# Grow further shapes/positions per-run without editing this file -- e.g. a next round, on top of
# this round's finished 30-layer model:
#     poetry run layer_grow sft --previous-checkpoint outputs/sft-layer-grow-29 --layers 30 \
#         --output-dir outputs/sft-layer-grow-30 --no-quant

model:
  model_name_or_path: "Qwen/Qwen2.5-0.5B-Instruct"  # base model pulled from the Hugging Face Hub
  load_in_4bit: false          # full bf16; `--no-quant` forces this off regardless
  torch_dtype: "auto"          # let transformers pick the dtype the checkpoint was saved in
  trust_remote_code: false     # Qwen2.5 ships standard modeling code; no custom code needed
  attn_implementation: null    # let transformers pick (e.g. sdpa); set "flash_attention_2" where supported

layer_grow:
  # The 28-layer checkpoint this round grows from -- see the header comment above.
  previous_checkpoint: "outputs/sft-layer-grow-29/checkpoint-1250"

  # Google Drive fallback for previous_checkpoint, used only when nothing usable is found at that
  # path locally. zip_file_id must point to a zip of checkpoint-1500 -- the whole directory as the
  # Trainer wrote it, layer_grow.json included. Its stack must be the 28 layers `layers` below
  # assumes; layer_grow rejects a mismatch up front.
  # cache_dir matches previous_checkpoint exactly, so the zip lands where that path expects it.
  gdrive:
    zip_file_id: 1pOTtA8VNhTE5zA35c8Y6OD-kWcc-w3v_
    cache_dir: "outputs/sft-layer-grow-29/checkpoint-1250"

  # Position(s) this round's new block(s) take in the *final* stack, 0-based. checkpoint-1500 is
  # already 28 layers (0-27), so [28] appends one more, giving 29.
  layers: [29]

  # Shape of this round's new block: 6144 = 96 heads x head_dim 64. hidden_size must equal
  # num_attention_heads * 64, and head_dim itself cannot change (shared rotary tables and KV cache
  # across the stack) -- so widen via num_attention_heads only. intermediate_size 33280 keeps the
  # 5.42 ratio of the earlier grown blocks (8320/1536, matching Qwen2.5-0.5B's own 4864/896).
  # Setting all four explicitly (rather than null, which inherits the newest block's shape from
  # checkpoint-1500; see layer_grow.model.resolve_growth_shape) keeps them fixed.
  #
  # Roughly 690M params for this block alone (est.: ~77M attention + ~613M MLP), several times
  # any block grown so far, on top of the already-trainable layers 24-27 (46.2M + 3 x 178.5M), against the same ~50k-row
  # dataset that already showed overfitting signs on layer 24's 46.2M alone (see README.md's
  # checkpoint-16000 interpretation). Worth watching eval_loss closely from step 1; the memory note
  # on per_device_train_batch_size applies even more.
  hidden_size: 6144
  intermediate_size: 33280
  num_attention_heads: 96
  num_key_value_heads: null    # null -> the base model's 2, same as the earlier grown blocks

  # "identity" zeroes this round's block's output projections, so it starts as a residual
  # passthrough and training moves away from exactly what checkpoint-1500 already was, rather
  # than injecting noise into a working stack from step one. Same reasoning as layer_expand.init.
  init: "identity"
  init_std: 0.02               # std of the normal init applied before the output zeroing

  # "auto" continues *this round* from <training.output_dir>/model if a previous attempt at it
  # already finished, otherwise builds a fresh block for layer 28. A run interrupted partway is
  # restored by the Trainer itself (optimizer state, LR schedule, step count included), which is
  # why this deliberately ignores checkpoint-N in output_dir -- see layer_grow.model's docstring.
  init_from_checkpoint: "auto"

data:
  # "local" reads dataset_name/eval_dataset_name straight off disk. "gdrive" first downloads
  # a zip from Google Drive into gdrive.cache_dir and extracts it there, then reads the same
  # paths -- so once downloaded, both readers behave identically.
  reader: "gdrive"
  dataset_name: "data/synthetic/dataset/sft_train-*.jsonl"   # training shards
  eval_dataset_name: "data/synthetic/dataset/sft_eval.jsonl" # held-out split, enables eval loss
  max_samples: 50000            # cap on training rows read from the glob
  max_eval_samples: 500         # eval runs every eval_steps and scores this whole split each time
  gdrive:
    zip_file_id: 1OIpO7MNVUyLrytjQwhJu-i2U5mJSmVkh
    cache_dir: "data/synthetic/dataset"

training:
  # A fresh directory, not outputs/sft-layer-grow: that one holds checkpoint-1500's own run, whose
  # layer_grow.json has four rounds (layer 24, then 25 three times). Pointing this round there
  # fails check_growth_matches (its checkpoints belong to the old 28-layer shape and cannot be
  # resumed into this 30-layer one), and the Trainer would otherwise resume from that run's
  # newest checkpoint-N as if it were this run's own.
  output_dir: "outputs/sft-layer-grow-30"
  # No training.gdrive block here (yet): this output_dir starts empty -- there is no zipped
  # checkpoint-N for *this* run to fall back to on a fresh machine until one has actually been
  # trained and uploaded. Add one here once you have a run worth resuming from elsewhere.
  num_train_epochs: 1          # max_steps overrides this
  max_steps: 20000
  # UNMEASURED for this round. The new 6144d/33280 block (~690M params) adds its activations and
  # AdamW moments on top of the already-trainable layers 24-27. The vocab projection
  # (151,936 x ~10 bytes/token) still dominates per-token activation memory, so memory does not
  # scale cleanly with params -- measure before committing to a batch size; drop
  # per_device_train_batch_size and raise gradient_accumulation_steps to match if it OOMs.
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4   # effective batch size = train_batch_size * this
  # Layers 24-27 are already past their own identity-init phase, so a lower-than-layer_expand LR --
  # those blocks are working parts of the model, not passthroughs being nudged off zero, and a peak
  # LR sized for that first move would overshoot on blocks that already have real weights.
  learning_rate: 5.0e-5
  lr_scheduler_type: "cosine"
  warmup_steps: 200            # shorter than layer_expand's: only layer 28 starts at identity now
  max_grad_norm: 1.0
  # Every trainable block has real, non-zero weights by the time this round starts (layers 24-27
  # from their own training, layer 28 from N(0, init_std) like layer_expand's blocks always
  # do) -- same reasoning as sft_layer_expand.yaml's weight_decay, carried forward.
  weight_decay: 0.02
  adam_beta2: 0.999
  neftune_noise_alpha: 5
  label_smoothing_factor: 0.0
  max_seq_length: 1536
  logging_steps: 10
  eval_steps: 50               # how often (in steps) eval loss is computed
  save_steps: 250              # must stay a round multiple of eval_steps when early_stopping is on
  save_total_limit: 5          # keep only the most recent few; the best one is exempt
  bf16: true
  # Off on purpose, same reasoning as layer_expand: every layer before the trainable tail is
  # frozen and stores no activations to recompute. Lower per_device_train_batch_size instead.
  gradient_checkpointing: false
  report_to: "none"
  # Five trainable blocks, the new one ~690M params alone, against the same ~50k-sample dataset
  # make the overfitting risk layer_expand already flagged more binding again -- layer 24 alone
  # (46.2M params) already showed overfitting signs (see README.md). Watch eval_loss from the
  # first eval_steps.
  early_stopping: true
  early_stopping_patience: 5
  # See sft_layer_expand.yaml's note: 0.0 counts any decrease, however small, as improvement and
  # can let a plateaued run grind on for thousands of extra steps. This carries the same fix.
  early_stopping_threshold: 0.002
