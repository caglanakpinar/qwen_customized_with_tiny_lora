# Layer growth: append one more transformer block on top of an already-expanded stack, and
# fine-tune it *together with* the block(s) already there -- unlike layer_expand, which freezes
# everything except the block it just added, this keeps the whole trainable tail open.
#
# This is round 3. Starting point is outputs/sft-layer-grow/checkpoint-1500: round 2's run of this
# config, a 26-layer model -- base 24 (0-23), layer 24 (1536d, from configs/sft_layer_expand.yaml
# via outputs/sft-layer-expand-wide/checkpoint-16000) and layer 25 (3072d, grown and fine-tuned in
# round 2). Its layer_grow.json must record exactly those two rounds, [24] (layer_expand) then
# [25] (layer_grow), same as outputs/sft-layer-grow/layer_grow.json. Not checkpoint-3750 from that
# same run directory: that one picked up a third, accidental [25] round (see configs/
# grpo_layer.yaml's header), which would put this round's block at the wrong index.
#
# This round appends layer 26 at layer 25's shape (3072d/16640 MLP/48 heads). Layers 24, 25 and
# 26 all stay trainable; only the original base (0-23, already carrying the merged TinyLoRA +
# layer_lora weights) stays frozen.
#
# There is no base_adapters here, unlike layer_expand: whatever adapters the first round merged
# are already baked into checkpoint-1500's weights (its full state dict is loaded, base layers
# included), and its sidecar carries the base_adapters list forward as a record only.
#
# Loading this checkpoint later needs the layer_grow package, the same way a layer_expand
# checkpoint needs layer_expand: `tiny-lora chat|serve|chat-api|eval --adapter <dir>` detect the
# layer_grow.json sidecar and handle it automatically, as do chat.sh/web.sh/eval.sh via ADAPTER.
#
# Build the dataset first (or leave data.reader: "gdrive" below):
#     bash data_generate.sh
#
# Then:
#     poetry run layer_grow sft --config configs/sft_layer.yaml --no-quant
#
# or, since this is the default config, just:
#     poetry run layer_grow sft --no-quant
#
# Grow further shapes/positions per-run without editing this file -- e.g. round 4, on top of this
# round's finished model:
#     poetry run layer_grow sft --previous-checkpoint outputs/sft-layer-grow-26 --layers 27 \
#         --output-dir outputs/sft-layer-grow-27 --no-quant

model:
  model_name_or_path: "Qwen/Qwen2.5-0.5B-Instruct"  # base model pulled from the Hugging Face Hub
  load_in_4bit: false          # full bf16; `--no-quant` forces this off regardless
  torch_dtype: "auto"          # let transformers pick the dtype the checkpoint was saved in
  trust_remote_code: false     # Qwen2.5 ships standard modeling code; no custom code needed
  attn_implementation: null    # let transformers pick (e.g. sdpa); set "flash_attention_2" where supported

layer_grow:
  # Round 2's run, pinned to the checkpoint fine-tuned for layer 25 -- see the header comment
  # above for why this one and not that run's newest.
  previous_checkpoint: "outputs/sft-layer-grow/checkpoint-1500"

  # Google Drive fallback for previous_checkpoint, used only when nothing usable is found at that
  # path locally. zip_file_id is null because the previous id (18edzBlAqXcHoTA5XRjBCNtVD8ViwngWf,
  # a zip of checkpoint-3750) returns 404 on Drive as of 2026-09-30, and was the wrong checkpoint
  # for this round anyway. Set it to a zip of checkpoint-1500 -- the whole directory as the Trainer
  # wrote it, layer_grow.json included -- to train on a machine that doesn't have it locally.
  # cache_dir matches previous_checkpoint exactly, so the zip lands where that path expects it.
  gdrive:
    zip_file_id: 1J-U3-JxOeEOqfIBlLbFdvBrYJ8rlnskT
    cache_dir: "outputs/sft-layer-grow/checkpoint-1500"

  # Position(s) this round's new block(s) take in the *final* stack, 0-based. checkpoint-1500 is
  # already 26 layers (0-23 base, 24 and 25 grown), so [26] appends one more, giving 27.
  layers: [26]

  # Shape of this round's new block: the same as layer 25's, spelled out rather than left null.
  # Null on all four would inherit exactly this from checkpoint-1500's newest round (see
  # layer_grow.model.resolve_growth_shape); explicit keeps it fixed if previous_checkpoint is ever
  # bumped to a checkpoint whose newest block has a different shape.
  #
  # 3072 = 48 heads x head_dim 64: hidden_size must equal num_attention_heads * 64, and head_dim
  # itself cannot change (shared rotary tables and KV cache across the stack) -- so widen via
  # num_attention_heads only. 16640 keeps layer 24's intermediate/hidden ratio (8320/1536 = 5.42,
  # matching Qwen2.5-0.5B's own 4864/896).
  #
  # Trainable this round: layer 24's 46.2M + layer 25's 178.5M + layer 26's 178.5M = 403.3M
  # params, ~45% of the ~897M-parameter 27-layer model (up from 224.7M/31% in round 2), against
  # the same ~50k-row dataset that already showed overfitting signs on layer 24's 46.2M alone
  # (see README.md's checkpoint-16000 interpretation). Worth watching eval_loss closely from step 1.
  hidden_size: 3072
  intermediate_size: 16640
  num_attention_heads: 48
  num_key_value_heads: null    # null -> the base model's 2, same as layer 25

  # "identity" zeroes this round's block's output projections, so it starts as a residual
  # passthrough and training moves away from exactly what checkpoint-1500 already was, rather
  # than injecting noise into a working stack from step one. Same reasoning as layer_expand.init.
  init: "identity"
  init_std: 0.02               # std of the normal init applied before the output zeroing

  # "auto" continues *this round* from <training.output_dir>/model if a previous attempt at it
  # already finished, otherwise builds a fresh block for layer 26. A run interrupted partway is
  # restored by the Trainer itself (optimizer state, LR schedule, step count included), which is
  # why this deliberately ignores checkpoint-N in output_dir -- see layer_grow.model's docstring.
  init_from_checkpoint: "auto"

data:
  # "local" reads dataset_name/eval_dataset_name straight off disk. "gdrive" first downloads
  # a zip from Google Drive into gdrive.cache_dir and extracts it there, then reads the same
  # paths -- so once downloaded, both readers behave identically.
  reader: "gdrive"
  dataset_name: "data/synthetic/dataset/sft_train-*.jsonl"   # training shards
  eval_dataset_name: "data/synthetic/dataset/sft_eval.jsonl" # held-out split, enables eval loss
  max_samples: 50000            # cap on training rows read from the glob
  max_eval_samples: 500         # eval runs every eval_steps and scores this whole split each time
  gdrive:
    zip_file_id: 1S68pV_1mDVjVNVNpFfhBEvX7S2ecmJsI
    cache_dir: "data/synthetic/dataset"

training:
  # A fresh directory, not outputs/sft-layer-grow: that one holds round 2's run (a layer_grow.json
  # with two rounds) and checkpoint-1500 itself. Pointing this round there would fail
  # check_growth_matches (three rounds vs two), and even past that the Trainer would resume from
  # round 2's newest checkpoint-N as if it were this run's own.
  output_dir: "outputs/sft-layer-grow-26"
  # No training.gdrive block here (yet): this output_dir starts empty -- there is no zipped
  # checkpoint-N for *this* run to fall back to on a fresh machine until one has actually been
  # trained and uploaded. Add one here once you have a run worth resuming from elsewhere.
  num_train_epochs: 1          # max_steps overrides this
  max_steps: 20000
  # UNMEASURED for this round. Round 2 trained 224.7M params at this batch size; this round trains
  # 403.3M (1.8x), adding a second 3072d/16640 block's activations and AdamW moments on top. The
  # vocab projection (151,936 x ~10 bytes/token) still dominates per-token activation memory, so
  # this is not a clean 1.8x either -- measure before committing to a batch size; drop
  # per_device_train_batch_size and raise gradient_accumulation_steps to match if it OOMs.
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4   # effective batch size = train_batch_size * this
  # Three trainable blocks, two of them (layers 24 and 25) already past their own identity-init
  # phase, so the same lower-than-layer_expand LR as round 2 -- those blocks are working parts of
  # the model, not passthroughs being nudged off zero, and a peak LR sized for that first move
  # would overshoot on blocks that already have real weights to disturb only carefully.
  learning_rate: 5.0e-5
  lr_scheduler_type: "cosine"
  warmup_steps: 200            # shorter than layer_expand's: only layer 26 starts at identity now
  max_grad_norm: 1.0
  # Every trainable block has real, non-zero weights by the time this round starts (layers 24 and
  # 25 from their own training, layer 26 from N(0, init_std) like layer_expand's blocks always
  # do) -- same reasoning as sft_layer_expand.yaml's weight_decay, carried forward.
  weight_decay: 0.02
  adam_beta2: 0.999
  neftune_noise_alpha: 5
  label_smoothing_factor: 0.0
  max_seq_length: 1536
  logging_steps: 10
  eval_steps: 50               # how often (in steps) eval loss is computed
  save_steps: 250              # must stay a round multiple of eval_steps when early_stopping is on
  save_total_limit: 5          # keep only the most recent few; the best one is exempt
  bf16: true
  # Off on purpose, same reasoning as layer_expand: every layer before the trainable tail is
  # frozen and stores no activations to recompute. Lower per_device_train_batch_size instead.
  gradient_checkpointing: false
  report_to: "none"
  # Three trainable blocks (403.3M params) against the same ~50k-sample dataset make the
  # overfitting risk layer_expand already flagged more binding again -- ~45% of the model is now
  # trainable, up from 31% in round 2 and 8.6% for layer 24 alone, which already showed
  # overfitting signs at 46.2M params (see README.md). Watch eval_loss from the first eval_steps.
  early_stopping: true
  early_stopping_patience: 5
  # See sft_layer_expand.yaml's note: 0.0 counts any decrease, however small, as improvement and
  # can let a plateaued run grind on for thousands of extra steps. This carries the same fix.
  early_stopping_threshold: 0.002
