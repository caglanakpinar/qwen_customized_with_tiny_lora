<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TinyLoRA Chat</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">T</div>
        <div class="brand-name">TinyLoRA Chat</div>
      </div>
      <button class="new-chat-btn" id="new-chat">New chat</button>
    </header>

    <main class="chat-scroll" id="chat-scroll">
      <div class="chat-column" id="chat-column">
        <div class="empty-state" id="empty-state">
          <h1>What are you working on?</h1>
          <p>This chat runs entirely on the TinyLoRA adapter loaded by the server. Ask it anything.</p>
        </div>
      </div>
    </main>

    <div class="composer">
      <form class="composer-inner" id="composer-form">
        <textarea
          id="message-input"
          rows="1"
          placeholder="Message TinyLoRA Chat..."
          autofocus
        ></textarea>
        <button class="send-btn" id="send-btn" type="submit" disabled aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19V5" />
            <path d="M5 12l7-7 7 7" />
          </svg>
        </button>
      </form>
      <div class="footnote">Responses are generated by a small local model and may be wrong.</div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
