[tool.poetry]
name = "tiny-lora"
version = "0.1.0"
description = "TinyLoRA training pipeline for LLMs"
authors = ["caglanakpinar"]
readme = "README.md"
packages = [{ include = "tiny_lora", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.1.0"
transformers = "^5.14.1"
peft = {git = "https://github.com/huggingface/peft.git", rev = "main"}
accelerate = "^1.0.0"
# >=4.0 is required on Python 3.14: datasets 3.x pins dill <0.3.9, and dill 0.3.8 cannot
# pickle under 3.14 (Pickler._batch_setitems changed signature), which breaks Dataset.map.
datasets = ">=4.0"
trl = "^0.14.0"
bitsandbytes = { version = "^0.45.0", optional = true }
pyyaml = "^6.0"
click = "^8.1.0"
sentencepiece = "^0.2.0"
protobuf = "^4.25.0"
feature-store-agent = {git = "https://github.com/caglanakpinar/feature-store-agent.git"}
gdown = { version = "^5.2.0", optional = true }
pathlib = "^1.0.1"
langchain-core = "^0.3.0"

[tool.poetry.extras]
quant = ["bitsandbytes"]
gdrive = ["gdown"]

# Needed to build the knowledge stores and generate the synthetic dataset under `data/`.
# Not needed to train on an already-generated dataset.
#     poetry install --with data
[tool.poetry.group.data]
optional = true

[tool.poetry.group.data.dependencies]
chromadb = "^1.5"
faiss-cpu = "^1.15"
numpy = "^2.0"

# Only needed to *execute* the code snippets the generator writes, which the verification
# in data/README.md does. Training and generation do not import these.
#     poetry install --with examples
[tool.poetry.group.examples]
optional = true

[tool.poetry.group.examples.dependencies]
pandas = "^2.2"
scikit-learn = "^1.5"
scipy = "^1.14"
statsmodels = "^0.14"
matplotlib = "^3.9"


[tool.poetry.group.dev.dependencies]
ipykernel = "^7.3.0"
jupyterlab = "^4.6.3"

[tool.poetry.scripts]
tiny-lora = "tiny_lora.cli:cli"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
